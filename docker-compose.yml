services:
  postgres:
    image: postgres:17
    container_name: trackread-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-trackread}
      POSTGRES_USER: ${DB_USERNAME:-trackread}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trackread123}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trackread-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: trackread-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - trackread-network
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    container_name: trackread-nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - trackread-network
    depends_on:
      - php

volumes:
  postgres_data:

networks:
  trackread-network:
    driver: bridge
