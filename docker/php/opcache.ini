; OPcache configuration for TrackRead
; Improves request latency by caching compiled PHP opcodes in memory.
;
; NOTE: validate_timestamps=0 — opcache stops re-checking file mtimes on
; every request. This is the key fix for slow bind-mount (Windows/Docker
; Desktop) filesystems, since it avoids a filesystem stat per included file.
;
; IMPORTANT: with validate_timestamps off, PHP code changes are NOT picked
; up automatically. After deploying code changes, run:
;     docker exec trackread-php sh -c "php -r 'opcache_reset();'"
; or restart the php container:
;     docker compose -f backend/docker-compose.yml restart php

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=0
opcache.use_cwd=1
opcache.fast_shutdown=1
opcache.jit=tracing
opcache.jit_buffer_size=32M
